# Render Blueprint: web dashboard (sync triggered via /api/run-sync by external cron)
# Deploy: Render dashboard → New → Blueprint → connect this repo

services:
  - type: web
    name: ticktick-notion-sync
    runtime: docker
    dockerCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    plan: free
    envVars:
      - key: TICKTICK_CLIENT_ID
        sync: false
      - key: TICKTICK_CLIENT_SECRET
        sync: false
      - key: TICKTICK_ACCESS_TOKEN
        sync: false
      - key: TICKTICK_REFRESH_TOKEN
        sync: false
      - key: NOTION_TOKEN
        sync: false
      - key: NOTION_DATABASE_ID
        sync: false
      - key: NOTION_TEMPLATE_ID
        sync: false
      - key: WEEKLY_ITEMS_DATABASE_ID
        sync: false
      - key: REDIRECT_URI
        value: http://localhost:8080/
      # Hour window for /api/run-sync (UTC)
      - key: SYNC_START_HOUR
        value: "8"
      - key: SYNC_END_HOUR
        value: "23"
      # Shared secret required by /api/run-sync (set a long random string)
      - key: CRON_SECRET
        generateValue: true
